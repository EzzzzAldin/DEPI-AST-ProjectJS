<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search for a User (Loading Simulation)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>Search for a User</h1>
        <p class="card__subtitle">
          Type a username and we'll fetch their data (simulated)
        </p>
      </header>

      <input
        type="text"
        id="usernameInput"
        class="search-input"
        placeholder="Type a username... (e.g. ezz)"
        autocomplete="off"
      />

      <div
        class="result-box"
        id="resultBox"
        style="display: flex; flex-direction: column; gap: 16px"
      >
        <!-- State 1 -->
        <p class="result-box__hint" id="hintState" style="width: 100%">
          Search will start when you type
        </p>

        <!-- State 2 -->
        <div
          class="result-box__loading-wrapper"
          id="loadingState"
          style="width: 100%"
        >
          <div class="spinner"></div>
          <p class="result-box__loading">Searching for the user...</p>
        </div>

        <!-- State 3 -->
        <p class="result-box__error" id="errorState" style="width: 100%">
          No user found with this username
        </p>

        <!-- State 4 -->
        <div class="result-box__user" id="userState" style="width: 100%">
          <div class="avatar" id="userAvatar">E</div>

          <div>
            <p class="user-name" id="userName">Ezz El-Din</p>
            <p class="user-meta" id="userRole">Full Stack Developer</p>
          </div>
        </div>
      </div>
    </main>

  </body>
</html>
