<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search for a User (Loading Simulation)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>Search for a User</h1>
        <p class="card__subtitle">
          Type a username and we'll fetch their data (simulated)
        </p>
      </header>

      <input
        type="text"
        id="usernameInput"
        class="search-input"
        placeholder="Type a username... (e.g. ezz)"
        autocomplete="off"
      />

      <div class="result-box" id="resultBox">
        <p class="result-box__hint">Search will start when you type</p>
      </div>
    </main>
  </body>
</html>
