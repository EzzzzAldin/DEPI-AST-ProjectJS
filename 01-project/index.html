<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Skills (Skills Tags)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <h1>My Skills</h1>
        <p class="card__subtitle">Add the skills you work with</p>
      </header>

      <form class="add-form" id="addForm">
        <input
          type="text"
          id="skillInput"
          class="add-form__input"
          placeholder="Type a skill... (e.g. React)"
          autocomplete="off"
        />
        <button type="submit" class="add-form__btn">Add</button>
      </form>

      <p class="empty-state" id="emptyState">No skills added yet</p>

      <ul class="tags" id="tagsList"></ul>
      <footer class="card__footer">
        <span id="countLabel">0 skills</span>
      </footer>
    </main>

    <script src="main.js"></script>
  </body>
</html>
